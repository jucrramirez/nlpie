name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v7
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev
          sudo ldconfig
      - name: Rust fmt
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features extension-module -- -D warnings
      - name: Cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync dev dependencies
        run: uv sync --extra dev --no-install-project
      - name: Ruff check
        run: uv run --no-sync ruff check python/ tests/
      - name: Ruff format check
        run: uv run --no-sync ruff format --check python/ tests/
      - name: Mypy type check
        run: uv run --no-sync mypy python/nlpie tests/
      - name: Pylint standards check
        run: uv run --no-sync pylint python/nlpie

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v7
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev
          sudo ldconfig
      - name: Configure Vcpkg environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -and (Test-Path "C:\vcpkg")) {
            $vcpkgRoot = "C:\vcpkg"
          }
          if (-not $vcpkgRoot) {
            $vcpkgCommand = Get-Command vcpkg -ErrorAction SilentlyContinue
            if ($vcpkgCommand) {
              $vcpkgRoot = Split-Path $vcpkgCommand.Source
            }
          }
          if (-not $vcpkgRoot) {
            throw "The GitHub-hosted Windows runner did not provide VCPKG_INSTALLATION_ROOT."
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_TRIPLET=x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Append
          $vcpkgRoot | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install maturin
        run: uv pip install --system maturin
      - name: Sync dependencies (no build — maturin develop handles it)
        run: uv sync --all-extras --no-install-project
      - name: Build Rust extension (Linux/macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync maturin develop
      - name: Install OpenBLAS (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: vcpkg install openblas --triplet x64-windows-static-md
      - name: Build Rust extension (Windows, OpenBLAS via vcpkg)
        if: runner.os == 'Windows'
        run: uv run --no-sync maturin develop --features "extension-module,ndarray-linalg/openblas-system"
      - name: Run Python tests
        run: uv run pytest tests/ -v
      - name: Run Rust tests
        run: cargo test

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenblas-dev patchelf
      - name: Create venv
        run: uv venv
      - name: Install maturin
        run: uv pip install maturin
      - name: Build wheel
        run: uv run maturin build --release --out target/wheels
      - name: Verify type stubs are packaged
        run: |
          echo "Looking for wheels..."
          ls -la target/wheels/
          WHEEL=$(ls -S target/wheels/*.whl | head -1)
          if [ -z "$WHEEL" ]; then
            find . -name "*.whl"
            exit 1
          fi
          unzip -l "$WHEEL" | grep -q "nlpie/_nlpie_core.pyi"
          unzip -l "$WHEEL" | grep -q "nlpie/py.typed"
      - name: Validate PEP 517 install (same path as `pip install git+...`)
        run: |
          uv venv /tmp/pkgtest
          uv pip install --python /tmp/pkgtest/bin/python .
          /tmp/pkgtest/bin/python -c "import nlpie; print('install OK:', nlpie.EmbeddingQualityReport)"
